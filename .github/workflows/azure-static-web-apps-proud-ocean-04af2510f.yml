name: Deploy to production (Azure Static Web Apps)

# Production only. PR previews were removed: a hybrid Next.js app reads DATABASE_URL at request time
# from the Azure resource's Environment variables, which every staging environment inherits, so a
# preview of this app always talks to the production database. Try changes on the dev site instead
# (azure-static-web-apps-dev.yml, deployed from `develop`).
on:
  push:
    branches:
      - main

jobs:
  build_and_deploy_job:
    name: Build and Deploy Job
    runs-on: ubuntu-latest
    # Pauses here until a required reviewer approves (Settings > Environments > production).
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Apply pending database migrations
        run: npx prisma migrate deploy
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROUD_OCEAN_04AF2510F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: ""
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
